name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Check APK network permissions
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > /tmp/permissions.txt
          cat /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then
            echo "Unexpected INTERNET permission in APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: meshi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
