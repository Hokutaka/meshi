name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Syntax-check APK upgrade verifier
        run: bash -n scripts/verify-apk-upgrade.sh
      - name: Check APK network permissions
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > /tmp/permissions.txt
          cat /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then
            echo "Unexpected INTERNET permission in APK"
            exit 1
          fi
      - name: Verify committed Room schema is unchanged
        run: |
          set -euo pipefail
          test -f app/schemas/dev.hokutaka.meshi.data.LedgerDatabase/1.json
          git diff --exit-code -- app/schemas
          if [ -n "$(git ls-files --others --exclude-standard app/schemas)" ]; then
            echo "Uncommitted Room schema detected; commit generated schemas with migrations."
            exit 1
          fi

      # CI debug signing keys are temporary on hosted runners.
      # Installable APKs are built with the persistent key by release.yml.

  database-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room and SQLCipher compatibility tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: gradle --no-daemon :app:connectedDebugAndroidTest
