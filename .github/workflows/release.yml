name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate release version
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Use a version tag like v0.1.0."
            exit 1
          }

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.MESHI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MESHI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MESHI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MESHI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Missing release signing secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meshi-release.jks"
          chmod 600 "$RUNNER_TEMP/meshi-release.jks"
          echo "MESHI_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/meshi-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          MESHI_RELEASE_STORE_PASSWORD: ${{ secrets.MESHI_RELEASE_STORE_PASSWORD }}
          MESHI_RELEASE_KEY_ALIAS: ${{ secrets.MESHI_RELEASE_KEY_ALIAS }}
          MESHI_RELEASE_KEY_PASSWORD: ${{ secrets.MESHI_RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            -PmeshiVersionName="$VERSION" -PmeshiVersionCode="$VERSION_CODE"

      - name: Verify APK and prepare artifacts
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > /tmp/meshi-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/meshi-permissions.txt; then
            echo "Unexpected INTERNET permission."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/meshi-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Download previous signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release; skip first-release upgrade check."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS_TAG" --pattern "meshi-*.apk" --dir "$RUNNER_TEMP/previous"
          mapfile -t OLD_APKS < <(find "$RUNNER_TEMP/previous" -maxdepth 1 -name "*.apk" -type f)
          if [ "${#OLD_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one previous signed APK"
            exit 1
          fi
          echo "PREVIOUS_APK=${OLD_APKS[0]}" >> "$GITHUB_ENV"

      - name: Enable KVM for update test
        if: env.PREVIOUS_APK != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify previous-to-current APK in-place update
        if: env.PREVIOUS_APK != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash scripts/verify-apk-upgrade.sh "$PREVIOUS_APK" app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "meshi $GITHUB_REF_NAME" --generate-notes
